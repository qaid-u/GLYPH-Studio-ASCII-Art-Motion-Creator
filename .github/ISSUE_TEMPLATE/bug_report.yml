name: Bug report
description: Report reproducible behavior in GLYPH Studio.
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version, and device
      placeholder: "For example: Edge 130 on Windows 11"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include screenshots or error messages only if they do not contain private data.
